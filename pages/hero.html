<!-- =========================================================
     JD PORTFOLIO — CINEMATIC HERO
     Hero Component

     CSS → css/hero.css
     JS  → js/hero.js

     NOTE:
     This file is loaded into index.html by global.js.
     ========================================================= -->

<section class="hero" id="hero">


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div
        class="hero__background"
        aria-hidden="true"
    >

        <!-- Background Image -->

        <img
            class="hero__background-image"
            src="assets/images/hero-mountain.jpg"
            alt=""
        >


        <!-- Cinematic Overlay -->

        <div
            class="hero__background-overlay"
        ></div>


        <!-- Particle Canvas -->

        <canvas
            class="hero__particles"
            id="hero-particles"
            aria-hidden="true"
        ></canvas>


        <!-- Cinematic Atmosphere -->

        <div
            class="hero__atmosphere"
            aria-hidden="true"
        ></div>


        <!-- Cinematic Smoke -->

        <div
            class="hero__smoke"
            aria-hidden="true"
        ></div>


        <!-- Cinematic Thunder -->

        <div
            class="hero__thunder"
            aria-hidden="true"
        ></div>


        <!-- Mouse Atmosphere -->

        <div
            class="hero__mouse-glow"
            id="hero-mouse-glow"
            aria-hidden="true"
        ></div>

    </div>



    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="hero__header">


        <!-- =================================================
             LOGO
             Full site restart
             Loader → Camera → Hero
             ================================================= -->

        <a
            href="index.html"
            class="hero__logo"
            aria-label="Jaydev Krishna home"
        >
            JD
        </a>



        <!-- =================================================
             DESKTOP NAVIGATION
             ================================================= -->

        <nav
            class="hero__nav"
            aria-label="Main navigation"
        >

            <!-- HOME
                 Skip Loader + Camera
                 Go directly to Hero -->

            <a
                href="index.html?direct=home#hero"
            >
                HOME
            </a>


            <!-- WORK -->

            <a
                href="pages/work.html"
            >
                WORK
            </a>


            <!-- ABOUT -->

            <a
                href="pages/about.html"
            >
                ABOUT
            </a>


            <!-- SERVICES -->

            <a
                href="pages/services.html"
            >
                SERVICES
            </a>


            <!-- CONTACT -->

            <a
                href="pages/contact.html"
            >
                CONTACT
            </a>

        </nav>



        <!-- =================================================
             MOBILE MENU BUTTON
             ================================================= -->

        <button
            class="hero__menu"
            id="hero-menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >

            <span>
                MENU
            </span>

            <span
                class="hero__menu-icon"
                aria-hidden="true"
            >

                <span></span>
                <span></span>

            </span>

        </button>

    </header>



    <!-- =====================================================
         HERO CONTENT
         ===================================================== -->

    <div class="hero__content">


        <!-- =================================================
             MAIN TITLE
             ================================================= -->

        <h1
            class="hero__title"
            aria-label="Jaydev"
        >

            <span
                class="hero__letter"
                data-letter="J"
            >
                J
            </span>


            <span
                class="hero__letter"
                data-letter="A"
            >
                A
            </span>


            <span
                class="hero__letter"
                data-letter="Y"
            >
                Y
            </span>


            <span
                class="hero__letter"
                data-letter="D"
            >
                D
            </span>


            <span
                class="hero__letter"
                data-letter="E"
            >
                E
            </span>


            <span
                class="hero__letter"
                data-letter="V"
            >
                V
            </span>

        </h1>



        <!-- =================================================
             FULL NAME
             ================================================= -->

        <p class="hero__firstname">
            KRISHNA
        </p>



        <!-- =================================================
             PROFESSIONAL TITLE
             ================================================= -->

        <p class="hero__subtitle">

            <span>
                CINEMATOGRAPHER
            </span>

            <span
                class="hero__separator"
                aria-hidden="true"
            >
                ·
            </span>

            <span>
                DOP
            </span>

            <span
                class="hero__separator"
                aria-hidden="true"
            >
                ·
            </span>

            <span>
                PHOTOGRAPHER
            </span>

            <span
                class="hero__separator"
                aria-hidden="true"
            >
                ·
            </span>

            <span>
                GRAPHIC DESIGNER
            </span>

            <span
                class="hero__separator"
                aria-hidden="true"
            >
                ·
            </span>

            <span>
                UI/UX DESIGNER
            </span>

        </p>



        <!-- =================================================
             PRIMARY CTA
             ================================================= -->

        <a
            href="pages/work.html"
            class="hero__cta"
        >

            <span>
                VIEW MY WORK
            </span>

            <span
                class="hero__cta-arrow"
                aria-hidden="true"
            >
                →
            </span>

        </a>

    </div>



    <!-- =====================================================
         SOCIAL LINKS
         ===================================================== -->

    <aside
        class="hero__social"
        aria-label="Social links"
    >

        <a
            href="#"
            aria-label="Instagram"
        >
            IG
        </a>


        <a
            href="#"
            aria-label="Vimeo"
        >
            VM
        </a>


        <a
            href="#"
            aria-label="Behance"
        >
            BE
        </a>

    </aside>



    <!-- =====================================================
         SECTION PAGINATION
         ===================================================== -->

    <div
        class="hero__pagination"
        aria-hidden="true"
    >

        <span class="is-active"></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>



    <!-- =====================================================
         LOCATION
         ===================================================== -->

    <div class="hero__location">

        <span
            class="hero__location-line"
        ></span>


        <span class="hero__location-text">

            BASED IN INDIA

            <span
                class="hero__location-separator"
            >
                |
            </span>

            KERALA

            <span
                class="hero__location-separator"
            >
                |
            </span>

            KOCHI

        </span>

    </div>



    <!-- =====================================================
         SECTION COUNTER
         ===================================================== -->

    <div class="hero__counter">

        <span
            class="hero__counter-current"
        >
            01
        </span>


        <span
            class="hero__counter-divider"
        >
            /
        </span>


        <span>
            06
        </span>

    </div>



    <!-- =====================================================
         MOBILE MENU OVERLAY
         ===================================================== -->

    <div
        class="hero__menu-overlay"
        id="hero-menu-overlay"
        aria-hidden="true"
    >


        <!-- Close Button -->

        <button
            class="hero__menu-close"
            type="button"
            aria-label="Close menu"
        >
            CLOSE
        </button>



        <!-- Mobile Navigation -->

        <nav
            class="hero__menu-navigation"
            aria-label="Mobile navigation"
        >

            <!-- HOME
                 Direct Hero -->

            <a
                href="index.html?direct=home#hero"
            >
                HOME
            </a>


            <!-- WORK -->

            <a
                href="pages/work.html"
            >
                WORK
            </a>


            <!-- ABOUT -->

            <a
                href="pages/about.html"
            >
                ABOUT
            </a>


            <!-- SERVICES -->

            <a
                href="pages/services.html"
            >
                SERVICES
            </a>


            <!-- CONTACT -->

            <a
                href="pages/contact.html"
            >
                CONTACT
            </a>

        </nav>

    </div>


</section>
