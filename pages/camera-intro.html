<!-- =========================================================
     JD PORTFOLIO — CAMERA INTRO
     ========================================================= -->

<section
    class="camera-intro"
    id="camera-intro"
    aria-hidden="true"
>

    <!-- =====================================================
         DESKTOP / TABLET VIDEO
    ===================================================== -->

    <video
        class="camera-intro__video camera-intro__video--desktop"
        id="camera-intro-video-desktop"
        muted
        playsinline
        webkit-playsinline
        autoplay
        preload="auto"
    >
        <source
            src="assets/videos/intro-camera.mp4"
            type="video/mp4"
        >
    </video>


    <!-- =====================================================
         MOBILE VIDEO
    ===================================================== -->

    <video
        class="camera-intro__video camera-intro__video--mobile"
        id="camera-intro-video-mobile"
        muted
        playsinline
        preload="auto"
    >
        <source
            src="assets/videos/intro-camera-mobile.mp4"
            type="video/mp4"
        >
    </video>

</section>
