<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JDK — Portfolio</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/loader.css">
</head>

<body>

  <div class="site-loader" id="site-loader">

    <div class="aperture-loader">

      <div class="aperture-loader__title">
        <span>ENTER THE</span>
        <span class="accent">PORTFOLIO</span>
      </div>

      <div class="aperture-loader__line">
        <span></span>
      </div>

      <div class="aperture-loader__percentage">
        <span id="loader-number">0</span>
        <span class="percent">%</span>
      </div>

      <div class="aperture-loader__progress">
        <span id="loader-progress"></span>
      </div>

    </div>

  </div>

  <script src="../js/loader.js"></script>

</body>
</html>
